# The wall, and the one origin behind it.
#
# Goes in /etc/nginx/sites-available/nazarenow.conf, symlinked into sites-enabled. This is
# a server block added to an nginx that is already serving another site on this Pi — it
# does not replace nginx.conf, and nothing here is global.
#
# ADR 0007 asks for three things this file provides:
#
#   1. The page and the API on ONE origin. The built frontend calls relative paths
#      (frontend/src/api.ts, asserted by src/api.test.ts and scripts/check-same-origin.mjs),
#      so /api/... lands here and is proxied to uvicorn on localhost. No CORS is involved
#      in the deployed configuration at all.
#   2. The API behind the SAME wall as the page. A private page in front of a public
#      /api/conditions/forecast is not private: that endpoint is the store.
#   3. TLS that renews without intervention — provided by ADR 0019, not by this file.
#
# Removing the password later is deleting the `auth_basic` and `auth_basic_user_file` lines
# from the server block below and from `location /api/`, then reloading. Four lines in two
# places — the `/api/` pair is repeated deliberately, for the same inheritance reason as the
# headers snippet. That is the "single documented step" #28 asks for.
#
# --- Why there is no `listen 443` in this file -------------------------------------------
#
# ADR 0019: this host is reached through a Cloudflare Tunnel. TLS terminates at Cloudflare's
# edge, `cloudflared` dials outward and delivers plain HTTP to localhost:80, and no inbound
# port is open on the network at all. So there is no certificate here, no ACME challenge
# location, and no certbot. Adding a TLS listener would not fail loudly — it would fail at
# `nginx -t`, naming a certificate file that is never going to exist.
#
# --- Why this file does not claim `default_server` ---------------------------------------
#
# No enabled block on this host sets it, so nginx makes the FIRST block it loads the default
# for any unmatched Host header, and sites-enabled loads alphabetically. `fitrakr` sorts
# before `nazarenow`, which is the only reason this file does not silently take over the
# neighbouring site's unmatched traffic. That is luck, not design, so: do not rename this
# file to anything sorting earlier, and do not add `default_server` here. Unmatched hostnames
# never arrive from the tunnel anyway — its ingress ends in a catch-all that answers without
# consulting nginx.

# Apex to www, so both spellings work and only one name needs to be the real one.
#
# `https://` in the redirect target even though this block is plain HTTP: the client's
# connection to Cloudflare is TLS, and that is the leg the browser's address bar reflects.
server {
    listen 80;
    listen [::]:80;
    server_name nazarenow.com;

    return 301 https://www.nazarenow.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.nazarenow.com;

    root /var/www/nazarenow;
    index index.html;

    # The site is deployed, not published. ADR 0007: an honest disclaimer is weaker
    # protection than a login when the underlying advice is "fly to Portugal". The
    # disclaimers stay prominent regardless; this comes off when the range is calibrated.
    #
    # ADR 0019 records what this does and does not defend against: the credentials cross
    # Cloudflare's edge in the clear, deliberately and with the same exposure as the two
    # sites already on this Pi.
    auth_basic "NazareNow";
    auth_basic_user_file /etc/nginx/nazarenow.htpasswd;

    include snippets/nazarenow-headers.conf;

    # --- The API -------------------------------------------------------------------
    #
    # Same server block as the page, so same origin and same password. uvicorn binds
    # 127.0.0.1 only, so this is the only route to it.
    location /api/ {
        auth_basic "NazareNow";
        auth_basic_user_file /etc/nginx/nazarenow.htpasswd;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A constant, not `$scheme`. nginx only ever sees the tunnel's plain-HTTP leg, so
        # `$scheme` is always `http` here and would tell uvicorn the opposite of what the
        # client actually used. This asserts the scheme of a leg nginx did not witness, and
        # it is true only because the tunnel is the sole route in — see ADR 0019.
        proxy_set_header X-Forwarded-Proto https;

        # A Pipeline Run writes every three hours and the API reads precomputed results,
        # so a slow response means something is wrong rather than something is large.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Never cached. The staleness banner is computed from the store's own timestamps,
        # and a cached response would let the page claim freshness it does not have —
        # which is the one thing #7 made this system stop doing.
        add_header Cache-Control "no-store" always;

        # Re-included because the add_header above cancels inheritance from the server block.
        include snippets/nazarenow-headers.conf;
    }

    # --- The built frontend --------------------------------------------------------
    #
    # Vite emits content-hashed asset filenames, so assets can be cached hard and the
    # entry document cannot be cached at all — otherwise a deploy leaves browsers on the
    # old bundle indefinitely.
    location /assets/ {
        # One Cache-Control and not two. `expires 1y` emits its own Cache-Control alongside
        # Expires, so pairing it with an add_header of the same name shipped the response
        # with two conflicting values of the header that decides how long a stale bundle
        # survives in somebody's browser.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/nazarenow-headers.conf;
    }

    # `location /` below lands here through try_files, so this is what actually serves the
    # page on every route — which is why it needs the headers as much as anything does.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        include snippets/nazarenow-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/nazarenow.access.log;
    error_log  /var/log/nginx/nazarenow.error.log;
}
