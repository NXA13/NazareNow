# The port-80-only config used once, to get the first certificate.
#
# `nazarenow.conf` listens on 443 and names certificate files. nginx refuses to start a
# TLS listener whose certificate does not exist, so installing it before certbot has run
# fails `nginx -t` — and certbot then has no enabled server block to work with either. That
# is a genuine chicken-and-egg, and this file is the egg.
#
# Install this, reload, obtain the certificate, then replace it with nazarenow.conf. The
# sequence is step 6 of deploy/README.md.
#
# It is not needed again. Renewals use the ACME location that nazarenow.conf keeps in its
# own port-80 blocks, which is why that location exists there ahead of the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name nazarenow.com www.nazarenow.com;

    # The only thing this config is for.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Anything else, while the certificate does not exist yet. Not a redirect to https,
    # which would not resolve.
    location / {
        return 503;
    }
}
