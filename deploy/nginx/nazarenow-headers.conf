# Response headers for every NazaréNow location.
#
# Installed to /etc/nginx/snippets/nazarenow-headers.conf and `include`d by the server
# block AND by every location that sets an add_header of its own.
#
# That repetition is not redundancy, it is the fix for a real defect. nginx inherits
# `add_header` from the enclosing level only when the current level declares *none* of its
# own. Three of this site's locations set their own Cache-Control, so each of them silently
# dropped all four headers below — including `location = /index.html`, which is where
# `try_files $uri $uri/ /index.html` internally lands, so the actual page on every route was
# the one thing served without them.

# Nothing unauthenticated can reach this site, so there is nothing to crawl. Stated anyway,
# for the day the password comes off — ADR 0007 has the wall coming down once the range is
# calibrated, and this header should be a deliberate decision at that point rather than an
# oversight discovered afterwards.
add_header X-Robots-Tag "noindex, nofollow" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
