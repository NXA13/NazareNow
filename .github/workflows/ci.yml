name: CI

on:
  push:
  pull_request:

# Versions match local development deliberately. Skew between CI and a developer's
# machine is a reliable source of "but it works here".
env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '26'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest -q

  analysis:
    name: Analysis scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Lint only. These scripts need their own heavy dependencies and real data to
      # run, so they are checked statically rather than executed. Committed code
      # nothing checks tends to rot.
      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check analysis/

      - name: Format
        run: ruff format --check analysis/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
