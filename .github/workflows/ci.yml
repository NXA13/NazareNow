name: CI

on:
  push:
  pull_request:

# Versions match local development deliberately. Skew between CI and a developer's
# machine is a reliable source of "but it works here".
env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '26'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest -q

  analysis:
    name: Analysis scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Lint only. These scripts need their own heavy dependencies and real data to
      # run, so they are checked statically rather than executed. Committed code
      # nothing checks tends to rot.
      #
      # scenarios/ joins them for the same reason and with a different excuse: it runs the
      # real pipeline, but against live Open-Meteo archive requests, so executing it here
      # would spend the provider's rate budget on every push to prove something a person
      # verifies by looking at the page.
      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check analysis/ scenarios/

      - name: Format
        run: ruff format --check analysis/ scenarios/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Story 27 of #1, which had no check behind it at all until now. This measures the
      # compressed bytes a first visit costs, which is the part of "loads quickly" this
      # repository controls; load time itself needs a host, and there is not one until #28.
      - name: Payload budget
        run: npm run check:payload

      # ADR 0007 serves the page and the API from one origin behind one password. A built
      # bundle naming a host of its own is either blocked by the browser or reaches a
      # backend the wall does not cover, and neither failure is visible to the suites —
      # both mock the boundary between frontend and backend.
      - name: Same origin
        run: npm run check:same-origin
