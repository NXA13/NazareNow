[project]
name = "nazarenow"
version = "0.1.0"
description = "Backend for NazareNow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Inherits line-length and the rule selection from the repo root, so the two configs
# cannot drift into disagreeing about what "lint clean" means.
extend = "../ruff.toml"
src = ["src", "tests"]
