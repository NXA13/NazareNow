[project]
name = "nazarenow"
version = "0.1.0"
description = "Backend for NazareNow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Imported by the Pipeline Run, the scheduler and the Open-Meteo source, so it is the
    # deployed scheduler's dependency and not only the test suite's. FastAPI happens to
    # install pydantic too, but the API imports it directly and a transitive install is a
    # dependency nobody declared.
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The four calibrated JSONs are code as far as the runtime is concerned: `thresholds.py`,
# `forecast_error.py`, `track_record.py` and `models/learned.py` each resolve theirs relative
# to `__file__`, so the file has to sit beside the module in site-packages. setuptools does
# not carry a data file inside a package unless it is told to, and without this the wheel
# contained none of them — an installed package that imports cleanly and dies on the first
# Pipeline Run. `amplification.json` has no override environment variable, so there is no
# host-side workaround for its absence.
[tool.setuptools.package-data]
nazarenow = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Inherits line-length and the rule selection from the repo root, so the two configs
# cannot drift into disagreeing about what "lint clean" means.
extend = "../ruff.toml"
src = ["src", "tests"]
