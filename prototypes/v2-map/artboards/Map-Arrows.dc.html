<!doctype html>
<html lang="en">

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #05070a; }
    .sw-drift { animation: swDrift 3.6s ease-in-out infinite; }
    .sw-drift.d2 { animation-delay: -0.9s; }
    .sw-drift.d3 { animation-delay: -1.8s; }
    .sw-drift.d4 { animation-delay: -2.7s; }
    .wd-drift { animation: wdDrift 1.9s ease-in-out infinite; }
    .wd-drift.e2 { animation-delay: -0.6s; }
    .wd-drift.e3 { animation-delay: -1.2s; }
    @keyframes swDrift {
      0%   { transform: translateY(-9px); opacity: 0.3; }
      50%  { transform: translateY(0px);  opacity: 1; }
      100% { transform: translateY(9px);  opacity: 0.3; }
    }
    @keyframes wdDrift {
      0%   { transform: translateY(-5px); opacity: 0.25; }
      50%  { transform: translateY(0px);  opacity: 0.85; }
      100% { transform: translateY(5px);  opacity: 0.25; }
    }
  </style>
</helmet>

    <span style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8f979f;">Arrow field</span>
    <span style="display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: #c7cdd4;"><span style="width: 20px; height: 2.2px; background: #4fd1ff;"></span>Swell &mdash; length by height</span>
    <span style="display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: #c7cdd4;"><span style="width: 20px; height: 1.3px; background: #d6e0ea;"></span>Wind &mdash; length by speed</span>
    <span style="font-size: 9.5px; color: #767e86; max-width: 190px; line-height: 1.4;">One arrow per forecast grid point</span>
  </div>
