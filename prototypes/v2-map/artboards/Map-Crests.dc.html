<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #05070a; }
    @keyframes crestMarch { from { transform: rotate(-50deg) translateY(0); } to { transform: rotate(-50deg) translateY(86px); } }
    @keyframes crestEcho  { from { transform: rotate(-50deg) translateY(0); } to { transform: rotate(-50deg) translateY(86px); } }
    @keyframes crestWind  { from { transform: rotate(-20deg) translateY(0); } to { transform: rotate(-20deg) translateY(38px); } }
    @keyframes breakGlow  { 0%, 100% { opacity: 0.18; transform: scale(0.85); } 50% { opacity: 0.6; transform: scale(1.15); } }
  </style>
</helmet>

<div style="width: 640px; height: 780px; box-sizing: border-box; position: relative; overflow: hidden; background: #05070a; color: #e9ecef; font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;">

  <svg viewBox="0 0 640 780" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-hidden="true">
    <rect x="0" y="0" width="640" height="780" fill="#05070a"></rect>
    <g fill="none" stroke="#1f262d" stroke-width="1">
      <path d="M470,0 L488,348 L502,390 L488,432 L470,780"></path>
      <path d="M418,0 L436,332 L499,390 L436,448 L418,780"></path>
      <path d="M360,0 L378,312 L496,390 L378,468 L360,780"></path>

      <path d="M238,0 L256,270 L488,390 L256,510 L238,780"></path>
      <path d="M172,0 L190,245 L484,390 L190,535 L172,780"></path>
      <path d="M104,0 L122,220 L480,390 L122,560 L104,780"></path>
      <path d="M34,0 L52,194 L476,390 L52,586 L34,780"></path>
    </g>
  </svg>

  <div style="position: absolute; left: 50%; top: 50%; width: 1700px; height: 1700px; margin-left: -850px; margin-top: -850px; background-image: repeating-linear-gradient(to bottom, rgba(120,190,230,0.14) 0 7px, rgba(120,190,230,0) 7px 86px); animation: crestEcho 4.1s linear infinite;"></div>
  <div style="position: absolute; left: 50%; top: 50%; width: 1700px; height: 1700px; margin-left: -850px; margin-top: -850px; background-image: repeating-linear-gradient(to bottom, rgba(226,243,252,0.92) 0 3px, rgba(226,243,252,0) 3px 86px); animation: crestMarch 4.1s linear infinite;"></div>

  <div style="position: absolute; left: 50%; top: 50%; width: 1700px; height: 1700px; margin-left: -850px; margin-top: -850px; background-image: repeating-linear-gradient(to bottom, rgba(214,224,234,0.26) 0 1.2px, rgba(214,224,234,0) 1.2px 38px); -webkit-mask-image: repeating-linear-gradient(to right, #000 0 18px, transparent 18px 64px); mask-image: repeating-linear-gradient(to right, #000 0 18px, transparent 18px 64px); animation: crestWind 2.1s linear infinite;"></div>

  <svg viewBox="0 0 640 780" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-hidden="true">
    <ellipse cx="516" cy="368" rx="30" ry="20" fill="#ff5f3d" opacity="0.3" style="animation: breakGlow 3s ease-in-out infinite; transform-origin: 516px 368px;"></ellipse>
    <path d="M560,0 L556,90 L548,170 L553,250 L546,320 L541,356 L508,392 L516,418 L548,448 L554,520 L547,600 L554,680 L549,780 L640,780 L640,0 Z" fill="#11161c" stroke="#3a4450" stroke-width="1.2"></path>

    <span style="font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #8f979f;">Marching crests</span>
    <span style="display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: #c7cdd4;"><span style="width: 20px; height: 3px; background: #e2f3fc;"></span>Crest spacing &equals; 13.75 s swell</span>

</x-dc>
